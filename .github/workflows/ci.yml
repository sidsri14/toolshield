name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: Self-scan a clean manifest
        run: node bin/toolshield.js scan test/fixtures/good-tools.json --fail-on high
      - name: Verify SARIF output
        run: |
          node bin/toolshield.js scan test/fixtures/bad-tools.json --format sarif > toolshield.sarif || true
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('toolshield.sarif','utf8')); if(s.version!=='2.1.0'||!s.runs[0].results.length) process.exit(1)"
